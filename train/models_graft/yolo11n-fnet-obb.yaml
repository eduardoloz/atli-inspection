# YOLO11n-OBB with FasterNet backbone graft (PConv blocks, modeled on Chen
# et al. CVPR'23 [chen2023fasternet]; app. inspiration Chai et al. 2025
# [chai2025fpfsyolo] -- see README.md for known deviations from the paper).
# ⚠ MUST be trained/loaded with FNET=1 and PYTHONPATH=~/atli/modpatch — that
# sitecustomize rebinds ultralytics.nn.tasks.C3Ghost to the vendored FasterNet
# block (C3Faster), so the "C3Ghost" entries below are NOT Ghost modules.
# The rebinding trick is needed because parse_model recognizes modules by class
# identity in a literal set; replacing an existing global is the only clean hook.
nc: 80
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3Ghost, [256]] # -> C3Faster(PConv) under FNET=1
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3Ghost, [512]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3Ghost, [512]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3Ghost, [1024]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 22 (P5/32-large)

  - [[16, 19, 22], 1, OBB, [nc, 1]] # OBB(P3, P4, P5)
